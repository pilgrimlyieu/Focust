version: 2
enable-beta-ecosystems: true
updates:
  # Frontend dependencies (Bun)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - "pilgrimlyieu"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # Group all dev dependencies together
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "typescript"
          - "vite"
        update-types:
          - "minor"
          - "patch"
      # Group production dependencies separately
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Backend dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - "pilgrimlyieu"
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Group Tauri-related dependencies
      tauri:
        patterns:
          - "tauri*"
        update-types:
          - "minor"
          - "patch"
      # Group other Rust dependencies
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - "pilgrimlyieu"
    labels:
      - "dependencies"
      - "ci"
