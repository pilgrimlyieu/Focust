name: Release Build

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'bun.lock'
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: 'Build and upload artifacts'
        type: boolean
        default: false
      release_mode:
        description: 'How to publish artifacts'
        type: choice
        options:
          - artifact
          - draft-release
        default: artifact
      platform:
        description: 'Target platform to build'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
        default: all

# ─── Derived Flags ───────────────────────────────────────────────────────────
# Centralised in the `setup` job so every downstream job can reference them
# without duplicating `startsWith(github.ref, ...)` everywhere.

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Setup — compute once, share everywhere
  # ═══════════════════════════════════════════════════════════════════════════
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      is_tag:         ${{ steps.flags.outputs.is_tag }}
      should_build:   ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      should_draft:   ${{ steps.flags.outputs.should_draft }}
      version:        ${{ steps.flags.outputs.version }}
      project_name:   ${{ steps.flags.outputs.project_name }}
      product_name:   ${{ steps.flags.outputs.product_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: flags
        shell: bash
        run: |
          IS_TAG=${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_DISPATCH=${{ github.event_name == 'workflow_dispatch' }}
          BUILD_INPUT=${{ github.event.inputs.build_artifacts == 'true' }}
          RELEASE_MODE="${{ github.event.inputs.release_mode }}"

          reject_multiline() {
            local name="$1"
            local value="$2"

            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must not contain newline characters" >&2
              exit 1
            fi
          }

          validate_version() {
            local name="$1"
            local value="$2"

            if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid $name: $value" >&2
              exit 1
            fi
          }

          # Read project metadata from config files
          PROJECT_NAME=$(jq -r '.name' package.json)
          PRODUCT_NAME=$(jq -r '.productName // empty' src-tauri/tauri.conf.json)
          PRODUCT_NAME=${PRODUCT_NAME:-$PROJECT_NAME}

          reject_multiline PROJECT_NAME "$PROJECT_NAME"
          reject_multiline PRODUCT_NAME "$PRODUCT_NAME"

          SHOULD_BUILD=false
          SHOULD_RELEASE=false
          SHOULD_DRAFT=false
          VERSION="0.0.0"

          if [ "$IS_TAG" = "true" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi

            VERSION="${GITHUB_REF_NAME#v}"
            validate_version VERSION "$VERSION"

            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag must point to a commit reachable from main" >&2
              exit 1
            fi

            SHOULD_BUILD=true
            SHOULD_RELEASE=true
          elif [ "$IS_DISPATCH" = "true" ] && [ "$BUILD_INPUT" = "true" ]; then
            SHOULD_BUILD=true
            VERSION=$(jq -r '.version // empty' package.json)
            validate_version VERSION "$VERSION"

            case "$RELEASE_MODE" in
              artifact)
                ;;
              draft-release)
                if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                  echo "Manual draft releases are only allowed on main" >&2
                  exit 1
                fi
                SHOULD_DRAFT=true
                ;;
              *)
                echo "Invalid release mode: $RELEASE_MODE" >&2
                exit 1
                ;;
            esac
          fi

          reject_multiline VERSION "$VERSION"

          {
            echo "project_name=$PROJECT_NAME"
            echo "product_name=$PRODUCT_NAME"
            echo "is_tag=$IS_TAG"
            echo "should_build=$SHOULD_BUILD"
            echo "should_release=$SHOULD_RELEASE"
            echo "should_draft=$SHOULD_DRAFT"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "### Build Flags" >> $GITHUB_STEP_SUMMARY
          echo "| Flag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| project_name | $PROJECT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| product_name | $PRODUCT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| is_tag | $IS_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| should_build | $SHOULD_BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| should_release | $SHOULD_RELEASE |" >> $GITHUB_STEP_SUMMARY
          echo "| should_draft | $SHOULD_DRAFT |" >> $GITHUB_STEP_SUMMARY
          echo "| version | $VERSION |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # Build — matrix across platforms
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build - ${{ matrix.os_name }}
    needs: setup
    if: always() && needs.setup.result == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            build_target: universal-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Platform filter (workflow_dispatch only) ──
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          SELECTED="${{ github.event.inputs.platform || 'all' }}"
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "${{ matrix.os_name }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping ${{ matrix.os_name }} (selected: $SELECTED)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── Environment setup ──
      - name: Checkout code
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Install x86_64 target for macOS universal binary
        if: steps.filter.outputs.skip != 'true' && matrix.os_name == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: steps.filter.outputs.skip != 'true' && matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxss-dev

      # ── Caching ──
      - name: Cache Rust dependencies
        if: steps.filter.outputs.skip != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}

      - name: Cache Bun downloads
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: bun ci

      - name: Setup code signing
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ (needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true') && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          SHOULD_SIGN: ${{ needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true' }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "✅ Updater signing key detected"
          elif [ "$SHOULD_SIGN" = "true" ]; then
            echo "❌ Updater signing key is required for tag releases and draft releases."
            echo "   Add TAURI_SIGNING_PRIVATE_KEY to GitHub Secrets before publishing."
            exit 1
          else
            echo "Updater signing is disabled for artifact-only builds."
          fi

      # ── Cache warm (non-build push to main) ──
      - name: Pre-warm Rust dependencies
        if: >
          steps.filter.outputs.skip != 'true' &&
          github.ref == 'refs/heads/main' &&
          needs.setup.outputs.should_build != 'true'
        shell: bash
        run: |
          echo "🔥 Warming Rust cache by compiling dependencies..."
          cd src-tauri
          if [[ "${{ matrix.os_name }}" == "macos" ]]; then
            echo "Building for aarch64-apple-darwin..."
            cargo build --release --target aarch64-apple-darwin
            echo "Building for x86_64-apple-darwin..."
            cargo build --release --target x86_64-apple-darwin
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          echo "✅ Rust cache pre-warmed."

      # ── Full Tauri build (tag release or manual build) ──
      - name: Build application
        if: steps.filter.outputs.skip != 'true' && needs.setup.outputs.should_build == 'true'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.build_target || matrix.target }}
          SHOULD_SIGN: ${{ needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true' }}
          HAS_SIGNING_KEY: ${{ (needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true') && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ (needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ (needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          build_args=(--target "$BUILD_TARGET")

          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            build_args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi

          bun run tauri build "${build_args[@]}"

      # ── Prepare & upload artifacts via script ──
      - name: Prepare artifacts
        if: steps.filter.outputs.skip != 'true' && needs.setup.outputs.should_build == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.os_name }}
          VERSION: ${{ needs.setup.outputs.version }}
          TARGET: ${{ matrix.build_target || matrix.target }}
        run: |
          bun scripts/ci/prepare-artifacts.ts \
            --platform "$PLATFORM" \
            --version "$VERSION" \
            --target "$TARGET"

      - name: Upload artifacts
        if: steps.filter.outputs.skip != 'true' && needs.setup.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.setup.outputs.project_name }}-${{ matrix.os_name }}
          path: artifacts/*
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Prepare release metadata with read-only permissions.
  # ═══════════════════════════════════════════════════════════════════════════
  prepare-release:
    name: Prepare Release
    needs: [setup, build]
    if: needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display artifacts
        run: ls -lh artifacts/

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          CHANGELOG_REF: ${{ needs.setup.outputs.should_draft == 'true' && github.sha || format('v{0}', needs.setup.outputs.version) }}
          REPO: ${{ github.repository }}
        run: |
          bun scripts/ci/generate-release-notes.ts \
            --version "$VERSION" \
            --tag "$CHANGELOG_REF" \
            --repo "$REPO" \
            --output release_body.md

      - name: Generate update manifest
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          TAG_NAME: ${{ needs.setup.outputs.should_draft == 'true' && 'draft' || format('v{0}', needs.setup.outputs.version) }}
          REPO: ${{ github.repository }}
        run: |
          bun scripts/ci/generate-manifest.ts \
            --version "$VERSION" \
            --tag "$TAG_NAME" \
            --repo "$REPO" \
            --artifacts-dir artifacts \
            --output artifacts/latest.json

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: artifacts/*
          if-no-files-found: error

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: release_body.md
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish release without checking out repository code.
  # ═══════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish Release
    needs: [setup, prepare-release]
    if: needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: release-metadata

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.setup.outputs.should_draft == 'true' && 'draft' || format('v{0}', needs.setup.outputs.version) }}
          RELEASE_NAME: ${{ needs.setup.outputs.product_name }} v${{ needs.setup.outputs.version }}${{ needs.setup.outputs.should_draft == 'true' && ' (Draft)' || '' }}
          IS_DRAFT: ${{ needs.setup.outputs.should_draft }}
          REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          shopt -s nullglob

          assets=()
          for asset in release-assets/*; do
            assets+=("$asset")
          done

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            if gh api "repos/$REPO/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
              gh api \
                --method PATCH \
                "repos/$REPO/git/refs/tags/$TAG_NAME" \
                -f sha="$RELEASE_TARGET" \
                -F force=true \
                >/dev/null
            else
              gh api \
                --method POST \
                "repos/$REPO/git/refs" \
                -f ref="refs/tags/$TAG_NAME" \
                -f sha="$RELEASE_TARGET" \
                >/dev/null
            fi
          fi

          release_args=(
            "$TAG_NAME"
            --repo "$REPO"
            --title "$RELEASE_NAME"
            --notes-file release-metadata/release_body.md
          )

          if [ "$IS_DRAFT" = "true" ]; then
            release_args+=(--draft --target "$RELEASE_TARGET")
          else
            release_args+=(--verify-tag)
          fi

          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            edit_args=(
              "$TAG_NAME"
              --repo "$REPO"
              --title "$RELEASE_NAME"
              --notes-file release-metadata/release_body.md
            )

            if [ "$IS_DRAFT" = "true" ]; then
              edit_args+=(--draft --target "$RELEASE_TARGET")
            fi

            gh release edit "${edit_args[@]}"

            if [ "$IS_DRAFT" = "true" ]; then
              while IFS= read -r asset; do
                if [ -n "$asset" ]; then
                  gh release delete-asset "$TAG_NAME" "$asset" --repo "$REPO" --yes
                fi
              done < <(gh release view "$TAG_NAME" --repo "$REPO" --json assets --jq '.assets[].name')
            fi

            gh release upload "$TAG_NAME" --repo "$REPO" --clobber -- "${assets[@]}"
          else
            gh release create "${release_args[@]}" -- "${assets[@]}"
          fi
