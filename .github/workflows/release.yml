name: Release Build

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'bun.lock'
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: 'Build and upload artifacts'
        type: boolean
        default: false
      release_mode:
        description: 'How to publish artifacts'
        type: choice
        options:
          - artifact
          - draft-release
        default: artifact
      platform:
        description: 'Target platform to build'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
        default: all

# ─── Derived Flags ───────────────────────────────────────────────────────────
# Centralised in the `setup` job so every downstream job can reference them
# without duplicating `startsWith(github.ref, ...)` everywhere.

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Setup — compute once, share everywhere
  # ═══════════════════════════════════════════════════════════════════════════
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      is_tag:         ${{ steps.flags.outputs.is_tag }}
      should_build:   ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      should_draft:   ${{ steps.flags.outputs.should_draft }}
      version:        ${{ steps.flags.outputs.version }}
      project_name:   ${{ steps.flags.outputs.project_name }}
      product_name:   ${{ steps.flags.outputs.product_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: flags
        shell: bash
        run: |
          IS_TAG=${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_DISPATCH=${{ github.event_name == 'workflow_dispatch' }}
          BUILD_INPUT=${{ github.event.inputs.build_artifacts == 'true' }}
          RELEASE_MODE="${{ github.event.inputs.release_mode }}"

          reject_multiline() {
            local name="$1"
            local value="$2"

            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must not contain newline characters" >&2
              exit 1
            fi
          }

          validate_version() {
            local name="$1"
            local value="$2"

            if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid $name: $value" >&2
              exit 1
            fi
          }

          # Read project metadata from config files
          PROJECT_NAME=$(jq -r '.name' package.json)
          PRODUCT_NAME=$(jq -r '.productName // empty' src-tauri/tauri.conf.json)
          PRODUCT_NAME=${PRODUCT_NAME:-$PROJECT_NAME}

          reject_multiline PROJECT_NAME "$PROJECT_NAME"
          reject_multiline PRODUCT_NAME "$PRODUCT_NAME"

          SHOULD_BUILD=false
          SHOULD_RELEASE=false
          SHOULD_DRAFT=false
          VERSION="0.0.0"

          if [ "$IS_TAG" = "true" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi

            VERSION="${GITHUB_REF_NAME#v}"
            validate_version VERSION "$VERSION"

            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag must point to a commit reachable from main" >&2
              exit 1
            fi

            SHOULD_BUILD=true
            SHOULD_RELEASE=true
          elif [ "$IS_DISPATCH" = "true" ] && [ "$BUILD_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual release builds are only allowed on main" >&2
              exit 1
            fi

            SHOULD_BUILD=true
            VERSION=$(jq -r '.version // empty' package.json)
            validate_version VERSION "$VERSION"

            if [ "$RELEASE_MODE" = "draft-release" ]; then
              SHOULD_DRAFT=true
            fi
          fi

          reject_multiline VERSION "$VERSION"

          {
            echo "project_name=$PROJECT_NAME"
            echo "product_name=$PRODUCT_NAME"
            echo "is_tag=$IS_TAG"
            echo "should_build=$SHOULD_BUILD"
            echo "should_release=$SHOULD_RELEASE"
            echo "should_draft=$SHOULD_DRAFT"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "### Build Flags" >> $GITHUB_STEP_SUMMARY
          echo "| Flag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| project_name | $PROJECT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| product_name | $PRODUCT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| is_tag | $IS_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "| should_build | $SHOULD_BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| should_release | $SHOULD_RELEASE |" >> $GITHUB_STEP_SUMMARY
          echo "| should_draft | $SHOULD_DRAFT |" >> $GITHUB_STEP_SUMMARY
          echo "| version | $VERSION |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # Build — matrix across platforms
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build - ${{ matrix.os_name }}
    needs: setup
    if: always() && needs.setup.result == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            build_target: universal-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Platform filter (workflow_dispatch only) ──
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          SELECTED="${{ github.event.inputs.platform || 'all' }}"
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "${{ matrix.os_name }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping ${{ matrix.os_name }} (selected: $SELECTED)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── Environment setup ──
      - name: Checkout code
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install x86_64 target for macOS universal binary
        if: steps.filter.outputs.skip != 'true' && matrix.os_name == 'macos'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: steps.filter.outputs.skip != 'true' && matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxss-dev

      # ── Caching ──
      - name: Cache Rust dependencies
        if: steps.filter.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}

      - name: Cache Node modules
        if: steps.filter.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          # restore-keys: |
          #   ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: bun ci

      - name: Setup code signing
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "✅ Code signing key detected"
          else
            echo "⚠️ No code signing key found. Build will proceed without signing."
            echo "   To enable code signing, add TAURI_SIGNING_PRIVATE_KEY to GitHub Secrets"
          fi

      # ── Cache warm (non-build push to main) ──
      - name: Pre-warm Rust dependencies
        if: >
          steps.filter.outputs.skip != 'true' &&
          github.ref == 'refs/heads/main' &&
          needs.setup.outputs.should_build != 'true'
        shell: bash
        run: |
          echo "🔥 Warming Rust cache by compiling dependencies..."
          cd src-tauri
          if [[ "${{ matrix.os_name }}" == "macos" ]]; then
            echo "Building for aarch64-apple-darwin..."
            cargo build --release --target aarch64-apple-darwin
            echo "Building for x86_64-apple-darwin..."
            cargo build --release --target x86_64-apple-darwin
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          echo "✅ Rust cache pre-warmed."

      # ── Full Tauri build (tag release or manual build) ──
      - name: Build application
        if: steps.filter.outputs.skip != 'true' && needs.setup.outputs.should_build == 'true'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.build_target || matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target "$BUILD_TARGET"

      # ── Prepare & upload artifacts via script ──
      - name: Prepare artifacts
        if: steps.filter.outputs.skip != 'true' && needs.setup.outputs.should_build == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.os_name }}
          VERSION: ${{ needs.setup.outputs.version }}
          TARGET: ${{ matrix.build_target || matrix.target }}
        run: |
          bun scripts/ci/prepare-artifacts.ts \
            --platform "$PLATFORM" \
            --version "$VERSION" \
            --target "$TARGET"

      - name: Upload artifacts
        if: steps.filter.outputs.skip != 'true' && needs.setup.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.setup.outputs.project_name }}-${{ matrix.os_name }}
          path: artifacts/*
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Release — only on tag push or draft-release dispatch
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs: [setup, build]
    if: needs.setup.outputs.should_release == 'true' || needs.setup.outputs.should_draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display artifacts
        run: ls -lh artifacts/

      - name: Generate release notes
        run: >
          bun scripts/ci/generate-release-notes.ts
          --version ${{ needs.setup.outputs.version }}
          --tag ${{ needs.setup.outputs.should_draft == 'true' && 'draft' || format('v{0}', needs.setup.outputs.version) }}
          --repo ${{ github.repository }}
          --output release_body.md

      - name: Generate update manifest
        run: >
          bun scripts/ci/generate-manifest.ts
          --version ${{ needs.setup.outputs.version }}
          --tag ${{ needs.setup.outputs.should_draft == 'true' && 'draft' || format('v{0}', needs.setup.outputs.version) }}
          --repo ${{ github.repository }}
          --artifacts-dir artifacts
          --output artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Draft releases use a fixed 'draft' tag so they never conflict with
          # real version tags. The tag is auto-created/updated each time.
          # Real releases (tag push) use the proper vX.Y.Z tag from github.ref.
          tag_name: ${{ needs.setup.outputs.should_draft == 'true' && 'draft' || format('v{0}', needs.setup.outputs.version) }}
          name: ${{ needs.setup.outputs.product_name }} v${{ needs.setup.outputs.version }}${{ needs.setup.outputs.should_draft == 'true' && ' (Draft)' || '' }}
          body_path: release_body.md
          files: artifacts/*
          draft: ${{ needs.setup.outputs.should_draft == 'true' }}
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
