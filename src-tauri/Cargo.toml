[package]
name = "focust"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

as_underscore = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
lossy_float_literal = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

alloc_instead_of_core = "warn"
allow_attributes = "warn"
assertions_on_result_states = "warn"
cognitive_complexity = "warn"
create_dir = "warn"
decimal_literal_representation = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
integer_division = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
module_inception = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
use_debug = "warn"
verbose_file_reads = "warn"

# I want to gradually fix these lints
# absolute_paths = "warn"
# allow_attributes_without_reason = "warn"
# redundant_test_prefix = "warn"
# undocumented_unsafe_blocks = "warn"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
debug-assertions = true
codegen-units = 256
lto = false
panic = "unwind"

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
debug-assertions = false
codegen-units = 1
lto = true
panic = "unwind"         # Support catching panics of DND implementation on Windows platform
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }
ts-rs = { version = "11.0.1", features = ["chrono-impl"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "^1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.42", features = ["serde"] }
tokio = { version = "*", features = ["time", "macros"] }
figment = { version = "0.10", features = ["toml"] }
toml = "0.9"
anyhow = "1.0.98"
thiserror = "2.0.17"
strum = "0.27.2"
strum_macros = "0.27.2"
user-idle2 = "0.6.2"
ts-rs = { version = "11.0.1", features = ["chrono-impl"] }
rand = "0.9.2"
rodio = "0.21.1"
parking_lot = "0.12"
sys-locale = "0.3.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-appender = "0.2.3"
futures = "0.3.31"
sysinfo = "0.37.2"
bitflags = "2.10.0"

[dev-dependencies]
tempfile = "3.23.0"
tauri = { version = "2", features = ["test"] }
tokio = { version = "*", features = ["test-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(target_family = "unix")'.dependencies]
tokio = { version = "*", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
futures-util = "0.3"

[package.metadata.cargo-machete]
ignored = ["tauri-build"]
